name: Build Release

on:
  release:
    types: [ created ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate and build standalone application
        run: ./Diagnostics/check.sh

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: groove-lab-standalone
          path: dist/standalone_yamaha.html
          if-no-files-found: error

      - name: Attach standalone application to GitHub Release
        if: github.event_name == 'release'
        run: gh release upload "$RELEASE_TAG" dist/standalone_yamaha.html --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
